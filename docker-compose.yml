services:
  couchdb:
    build: .
    container_name: couchdb-obsidian-sync
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin_user}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-admin_password}
    volumes:
      - ./data:/opt/couchdb/data
      - ./config:/config
    ports:
      - "5984:5984"
    restart: unless-stopped