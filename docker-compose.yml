services:
  couchdb:
    image: apache/couchdb:latest
    container_name: couchdb-obsidian-sync
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-password}
    volumes:
      - ./data:/opt/couchdb/data
    ports:
      - "5984:5984"
    restart: unless-stopped
