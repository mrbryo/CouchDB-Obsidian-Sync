services:
  couchdb:
    build: .
    container_name: couchdb-obsidian-sync
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin_user}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-admin_password}
      - COUCHDB_PERUSER=${COUCHDB_PERUSER:-false}
      - COUCHDB_PORT=${COUCHDB_PORT:-5984}
      - COUCHDB_LOG_LEVEL=${COUCHDB_LOG_LEVEL:-info}
      - TZ=America/Los_Angeles
    volumes:
      - ./data:/opt/couchdb/data
      - ./config:/config
    ports:
      - "${COUCHDB_PORT:-5984}:${COUCHDB_PORT:-5984}"
    restart: unless-stopped