[httpd]
enable_cors = true
WWW-Authenticate = Basic realm="CouchDB"

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost,https://localhost
credentials = true
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer
; Set to 1 hour
max_age = 3600

[chttpd]
; require_valid_user = true
; 4GB for large bulk imports
max_http_request_size = 4294967296

[chttpd_auth]
; require_valid_user = true
authentication_redirect = /_utils/session.html
secret = {COUCHDB_SECRET}

[couchdb]
; Set to true for single-node setup
single_node = true
; 50MB limit for larger attachments
max_document_size = 50000000
database_dir = {COUCHDB_DATA_DIR}

[log]
writer = stderr
level = {COUCHDB_LOG_LEVEL}

[cluster]
n = 1
q = 1
r = 1
w = 1

[admins]
{COUCHDB_USER} = {COUCHDB_PASSWORD}
